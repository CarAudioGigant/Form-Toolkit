# Render Blueprint — CarAudioGigant Forms Toolkit
# https://render.com/docs/blueprint-spec
#
# Connect this repo (CarAudioGigant/Form-Toolkit) in the Render Dashboard,
# or create a Blueprint from this file.

services:
  - type: web
    name: caraudiogigant-form-toolkit
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /
    autoDeployTrigger: commit
    disk:
      name: form-toolkit-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        value: file:/data/prod.sqlite
      - key: SCOPES
        value: write_files,write_app_proxy,read_metaobjects,write_metaobjects
      # Set these in the Render Dashboard (do not commit secrets):
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
